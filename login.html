<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CryptoFXMiners — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:#0a0a0a; --input-bg:#0d0d0d; --border:rgba(255,255,255,0.1);
      --gold:#f5a623; --gold-dark:#d4891a; --text-hi:#ffffff; --text-lo:#888;
      --font-display:'Syne',sans-serif; --font-body:'DM Sans',sans-serif;
    }
    body { background:var(--bg); color:var(--text-hi); font-family:var(--font-body); min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:3rem 1.25rem 4rem; position:relative; overflow-x:hidden; }
    body::before { content:''; position:fixed; inset:0; z-index:0; background:radial-gradient(circle at 8% 60%,rgba(245,166,35,0.04) 0%,transparent 40%),radial-gradient(circle at 92% 25%,rgba(245,166,35,0.04) 0%,transparent 40%); pointer-events:none; }
    .dot { position:fixed; width:6px; height:6px; border-radius:50%; background:var(--gold); opacity:0.35; animation:dotFloat 6s ease-in-out infinite; z-index:0; }
    .dot:nth-child(1){top:28%;left:4%;animation-delay:0s;animation-duration:7s}
    .dot:nth-child(2){top:60%;left:3%;animation-delay:1.5s;animation-duration:5s}
    .dot:nth-child(3){top:78%;right:3%;animation-delay:0.8s;animation-duration:6s}
    .dot:nth-child(4){top:18%;right:4%;animation-delay:2s;animation-duration:8s}
    .dot:nth-child(5){top:90%;left:96%;animation-delay:3s;animation-duration:6s}
    @keyframes dotFloat{0%,100%{transform:translateY(0);opacity:0.35}50%{transform:translateY(-14px);opacity:0.6}}
    .login-card { position:relative; z-index:1; width:100%; max-width:560px; }
    .login-logo { display:block; text-align:center; text-decoration:none; margin-bottom:2.75rem; }
    .login-logo span { font-family:var(--font-display); font-size:clamp(1.6rem,5vw,2.2rem); font-weight:800; letter-spacing:0.06em; text-transform:uppercase; }
    .login-logo .crypto{color:#fff} .login-logo .fxminers{color:var(--gold)}
    .login-heading { font-size:1.35rem; font-weight:400; margin-bottom:0.5rem; }
    .login-underline { width:48px; height:3px; background:var(--gold); border-radius:2px; margin-bottom:2.25rem; }
    .login-form { display:flex; flex-direction:column; gap:1.25rem; }
    .field-group { display:flex; flex-direction:column; gap:0.45rem; }
    .field-group label { font-size:0.9rem; font-weight:400; }
    .field-group input { width:100%; background:var(--input-bg); border:1px solid var(--border); border-radius:6px; padding:0.9rem 1rem; color:var(--text-hi); font-family:var(--font-body); font-size:0.95rem; outline:none; transition:border-color 0.2s,box-shadow 0.2s; }
    .field-group input:focus { border-color:rgba(245,166,35,0.5); box-shadow:0 0 0 3px rgba(245,166,35,0.08); }
    .pw-wrap { position:relative; }
    .pw-wrap input { padding-right:2.75rem; }
    .pw-toggle { position:absolute; right:0.9rem; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; color:var(--text-lo); font-size:0.9rem; transition:color 0.2s; }
    .pw-toggle:hover{color:var(--gold)}
    .options-row { display:flex; align-items:center; justify-content:space-between; }
    .remember-wrap { display:flex; align-items:center; gap:0.6rem; }
    .remember-wrap input[type="checkbox"] { width:18px; height:18px; accent-color:var(--gold); cursor:pointer; }
    .remember-wrap label { font-size:0.875rem; color:var(--text-lo); cursor:pointer; user-select:none; }
    .forget-link { font-size:0.875rem; color:var(--gold); text-decoration:none; font-weight:500; transition:color 0.2s; }
    .forget-link:hover{text-decoration:underline}
    .btn-signin { background:var(--gold); color:#000; font-family:var(--font-body); font-size:1rem; font-weight:700; padding:0.95rem 2.5rem; border-radius:7px; border:none; cursor:pointer; width:fit-content; margin-top:0.25rem; transition:background 0.2s,transform 0.2s,box-shadow 0.2s; display:flex; align-items:center; gap:0.6rem; }
    .btn-signin:hover{background:var(--gold-dark);transform:translateY(-2px);box-shadow:0 6px 24px rgba(245,166,35,0.25)}
    .btn-signin:disabled{opacity:0.6;cursor:not-allowed;transform:none}
    .register-link { margin-top:1.5rem; font-size:0.9rem; color:var(--text-lo); }
    .register-link a { color:var(--gold); text-decoration:none; font-weight:500; }
    .field-error { font-size:0.75rem; color:#f87171; display:none; margin-top:0.2rem; }
    .field-group.invalid input { border-color:rgba(248,113,113,0.5); }
    .field-group.invalid .field-error { display:block; }
    .toast { position:fixed; top:1.5rem; left:50%; transform:translateX(-50%) translateY(-80px); background:#1a1a1a; border:1px solid var(--border); color:var(--text-hi); font-size:0.875rem; font-weight:500; padding:0.85rem 1.5rem; border-radius:10px; box-shadow:0 8px 32px rgba(0,0,0,0.4); z-index:9999; transition:transform 0.4s cubic-bezier(.34,1.56,.64,1); max-width:90vw; }
    .toast.show{transform:translateX(-50%) translateY(0)}
    .toast.success{border-color:rgba(34,197,94,0.4)}
    .toast.error{border-color:rgba(248,113,113,0.4)}
    .spinner{width:16px;height:16px;border:2px solid rgba(0,0,0,0.3);border-top-color:#000;border-radius:50%;animation:spin 0.7s linear infinite;display:none}
    .btn-signin:disabled .spinner{display:inline-block}
    @keyframes spin{to{transform:rotate(360deg)}}
    .whatsapp-float{position:fixed;bottom:28px;left:24px;width:56px;height:56px;background:#25d366;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(37,211,102,0.45);z-index:999;text-decoration:none;transition:transform 0.25s}
    .whatsapp-float:hover{transform:scale(1.1)}
    .whatsapp-float::before{content:'';position:absolute;inset:-4px;border-radius:50%;border:2px solid rgba(37,211,102,0.5);animation:waRing 2.5s ease-out infinite}
    @keyframes waRing{0%{transform:scale(1);opacity:0.8}100%{transform:scale(1.6);opacity:0}}
    .wa-tooltip{position:absolute;left:calc(100% + 12px);bottom:8px;background:#fff;color:#111;font-family:var(--font-body);font-size:0.8rem;font-weight:500;line-height:1.4;padding:0.55rem 0.85rem;border-radius:10px;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,0.15);pointer-events:none;opacity:0;transform:translateX(-6px);transition:opacity 0.2s,transform 0.2s}
    .wa-tooltip::before{content:'';position:absolute;top:50%;left:-6px;transform:translateY(-50%);border:6px solid transparent;border-right-color:#fff;border-left:0}
    .whatsapp-float:hover .wa-tooltip{opacity:1;transform:translateX(0)}
    @media(max-width:480px){body{padding:2rem 1rem 3rem;justify-content:flex-start;padding-top:3rem}}
  </style>
</head>
<body>
  <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
  <div class="toast" id="toast"></div>

  <div class="login-card">
    <a href="index.html" class="login-logo">
      <span class="crypto">Crypto</span><span class="fxminers">FXMINERS</span>
    </a>
    <h1 class="login-heading">Sign in to your account</h1>
    <div class="login-underline"></div>

    <form class="login-form" id="loginForm" novalidate>
      <div class="field-group" id="fg-email">
        <label for="email">Your Email</label>
        <input type="email" id="email" autocomplete="email"/>
        <span class="field-error">Please enter a valid email address.</span>
      </div>
      <div class="field-group" id="fg-password">
        <label for="password">Your Password</label>
        <div class="pw-wrap">
          <input type="password" id="password" autocomplete="current-password"/>
          <button type="button" class="pw-toggle" id="pwToggle">👁</button>
        </div>
        <span class="field-error">Please enter your password.</span>
      </div>
      <div class="options-row">
        <div class="remember-wrap">
          <input type="checkbox" id="remember" checked/>
          <label for="remember">Remember Me</label>
        </div>
        <a href="forgot-password.html" class="forget-link">Forget Password</a>
      </div>
      <button type="submit" class="btn-signin" id="submitBtn">
        <span class="spinner" id="spinner"></span>
        <span id="btnText">Sign In</span>
      </button>
    </form>
    <p class="register-link">Not Registered Yet ? <a href="register.html">Create an Account</a></p>
  </div>

  <a href="https://wa.me/+254794645880" class="whatsapp-float" target="_blank" rel="noopener">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="28" height="28" fill="#fff"><path d="M16 0C7.163 0 0 7.163 0 16c0 2.822.736 5.472 2.027 7.774L0 32l8.418-2.005A15.93 15.93 0 0016 32c8.837 0 16-7.163 16-16S24.837 0 16 0zm0 29.5a13.43 13.43 0 01-6.845-1.872l-.49-.29-5.001 1.192 1.216-4.862-.32-.5A13.46 13.46 0 012.5 16C2.5 8.544 8.544 2.5 16 2.5S29.5 8.544 29.5 16 23.456 29.5 16 29.5zm7.44-9.77c-.408-.204-2.414-1.19-2.788-1.327-.374-.136-.646-.204-.918.204-.272.408-1.054 1.327-1.292 1.599-.238.272-.476.306-.884.102-.408-.204-1.724-.635-3.284-2.026-1.213-1.082-2.033-2.42-2.27-2.828-.238-.408-.026-.629.179-.832.183-.183.408-.476.612-.714.204-.238.272-.408.408-.68.136-.272.068-.51-.034-.714-.102-.204-.918-2.21-1.258-3.028-.332-.796-.67-.688-.918-.7l-.782-.013c-.272 0-.714.102-1.088.51-.374.408-1.428 1.394-1.428 3.4s1.462 3.944 1.666 4.216c.204.272 2.876 4.388 6.972 6.154.975.42 1.735.672 2.328.861.978.31 1.869.266 2.573.162.785-.117 2.414-.986 2.754-1.938.34-.952.34-1.768.238-1.938-.102-.17-.374-.272-.782-.476z"/></svg>
    <span class="wa-tooltip">We are here to help,<br/>Let's Chat</span>
  </a>

  <!-- Load cookies helper first -->
  <script src="cookies.js"></script>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

    const supabase = createClient(
      'https://xbazuosvlggtolahgcjv.supabase.co',
      'sb_publishable_9Wy4npRqw4-b5XbldMQACg_RF2uXc-F'
    )

    // Redirect if already logged in
    const { data: { session: existing } } = await supabase.auth.getSession()
    if (existing) window.location.href = 'dashboard.html'

    // Password toggle
    document.getElementById('pwToggle').addEventListener('click', () => {
      const input = document.getElementById('password')
      const on = input.type === 'password'
      input.type = on ? 'text' : 'password'
      document.getElementById('pwToggle').textContent = on ? '🙈' : '👁'
    })

    // Toast
    function showToast(msg, type = 'error') {
      const t = document.getElementById('toast')
      t.textContent = msg
      t.className = `toast ${type} show`
      setTimeout(() => t.classList.remove('show'), 4500)
    }

    // Loading
    function setLoading(on) {
      document.getElementById('submitBtn').disabled = on
      document.getElementById('spinner').style.display = on ? 'inline-block' : 'none'
      document.getElementById('btnText').textContent = on ? 'Signing In...' : 'Sign In'
    }

    // Clear invalid on input
    document.querySelectorAll('.field-group input').forEach(el => {
      el.addEventListener('input', () => el.closest('.field-group').classList.remove('invalid'))
    })

    // Submit
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault()

      const emailVal = document.getElementById('email').value.trim()
      const passVal  = document.getElementById('password').value
      const remember = document.getElementById('remember').checked

      let ok = true

      const emailFg = document.getElementById('fg-email')
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailVal)) {
        emailFg.classList.add('invalid'); ok = false
      } else { emailFg.classList.remove('invalid') }

      const passFg = document.getElementById('fg-password')
      if (!passVal) {
        passFg.classList.add('invalid'); ok = false
      } else { passFg.classList.remove('invalid') }

      if (!ok) return
      setLoading(true)

      try {
        const { data, error } = await supabase.auth.signInWithPassword({
          email:    emailVal,
          password: passVal,
        })

        if (error) throw error

        // ── Set session cookies
        if (data.session) {
          // If "Remember Me" checked → 7 days, else session only (1 day)
          const days = remember ? 7 : 1
          setSessionCookie(data.session, days)
        }

        showToast('✅ Signed in successfully! Redirecting...', 'success')
        setTimeout(() => window.location.href = 'dashboard.html', 1200)

      } catch (err) {
        const msg = err.message || ''
        if (msg.toLowerCase().includes('invalid') || msg.toLowerCase().includes('credentials')) {
          showToast('⚠️ Incorrect email or password. Please try again.')
        } else if (msg.toLowerCase().includes('confirm') || msg.toLowerCase().includes('verified')) {
          showToast('⚠️ Please verify your email first. Check your inbox.')
        } else {
          showToast(`⚠️ ${msg || 'Sign in failed. Please try again.'}`)
        }
      } finally {
        setLoading(false)
      }
    })
  </script>
</body>
</html>
